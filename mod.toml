# Settings for the mod. RecompModTool reads this to make the .nrm file.

[manifest]

id = "btga_gang_mod"

version = "1.0.2"

# Shown in the Mods menu.
display_name = "Gang Mod: Extra Tanks"
description = """
More friendly and enemy tanks in every campaign mission. \
Pick how many to add to each side, their class, what they do and how good they are, in this mod's options. \
They're the game's own AI tanks.

Allies join your gang on its spawn spots a couple of seconds into the mission, \
and hunt the enemy or escort you. \
Enemies join the first enemy gang that shows up, where it brings in its tanks. \
Also: an option to take the trains out of every level.

https://github.com/wootbeer/btgarecomp-gang-mod"""
short_description = "More ally and enemy tanks in the campaign."

authors = [ "wootbeer" ]

game_id = "btga"

minimum_recomp_version = "0.1.8"

dependencies = []
optional_dependencies = []

native_libraries = []

[inputs]

elf_path = "build/mod.elf"

mod_filename = "btga_gang_mod"

func_reference_syms_file = "syms/battletanxga.us.rev0.syms.toml"
data_reference_syms_files = []

additional_files = [ "thumb.png" ]

# Options shown in the Mods menu. Read them with recomp_get_config_u32.
# The order of each Enum's options matters: src/main.c reads the option's
# index. Class choices: Random, the mission's own (or yours, for allies),
# then the tanks in the game's order.

[[manifest.config_options]]
id = "ally_count"
name = "Extra Allies"
description = "How many AI tanks to add to your side in each campaign mission."
type = "Number"
min = 0
max = 10
step = 1
precision = 0
percent = false
default = 2

[[manifest.config_options]]
id = "ally_class"
name = "Ally Class"
description = "The class of the extra allies. Random picks a different one for each. Same as Yours copies your tank. A class change starts with the next mission."
type = "Enum"
options = [ "Random", "Same as Yours", "M1A1", "Mototank", "Goliath", "FLP-E Tank", "Hovertank", "Rattler", "Rhino", "M-2 Hydra", "Inferno", "Marksman", "Hornet" ]
default = "Random"

[[manifest.config_options]]
id = "ally_orders"
name = "Ally Orders"
description = "What the extra allies do. Escort You: they stay with you and attack enemies that come near you or them. Hunt Enemies: they go after the enemy on their own, like the mission's own allies. Auto: Hunt in missions where you destroy all the enemy tanks, Escort in the rest (get somewhere, rescue, protect, destroy a target)."
type = "Enum"
options = [ "Auto", "Escort You", "Hunt Enemies" ]
default = "Auto"

[[manifest.config_options]]
id = "ally_skill"
name = "Ally Skill"
description = "How good the extra allies are. Game: as the game makes them for your gang (they see about 0.4 of their class's range and wait about 1.6 s between volleys). Veteran: they see farther and shoot more often. Elite: the game's best AI level (they see about 2.5 times as far and shoot about 2.5 times as often)."
type = "Enum"
options = [ "Game", "Veteran", "Elite" ]
default = "Veteran"

[[manifest.config_options]]
id = "enemy_count"
name = "Extra Enemies"
description = "How many AI tanks to add to the enemy in each campaign mission. They come in when the first enemy tank shows up."
type = "Number"
min = 0
max = 15
step = 1
precision = 0
percent = false
default = 3

[[manifest.config_options]]
id = "enemy_class"
name = "Enemy Class"
description = "The class of the extra enemies. Random picks a different one for each. Same as Theirs copies the first enemy tank. A class change starts with the next mission."
type = "Enum"
options = [ "Random", "Same as Theirs", "M1A1", "Mototank", "Goliath", "FLP-E Tank", "Hovertank", "Rattler", "Rhino", "M-2 Hydra", "Inferno", "Marksman", "Hornet" ]
default = "Random"

[[manifest.config_options]]
id = "enemy_orders"
name = "Enemy Orders"
description = "What the extra enemies do. Same as Theirs: what the mission's own enemy tanks there do (or Hunt, if those just wait). Hunt: they come after you and your allies."
type = "Enum"
options = [ "Same as Theirs", "Hunt" ]
default = "Same as Theirs"

[[manifest.config_options]]
id = "enemy_skill"
name = "Enemy Skill"
description = "How good the extra enemies are (the mission's own enemies are left as they are). Game: as the game makes them for their gang. Veteran: they see farther and shoot more often. Elite: the game's best AI level."
type = "Enum"
options = [ "Game", "Veteran", "Elite" ]
default = "Game"

[[manifest.config_options]]
id = "remove_trains"
name = "Remove Trains"
description = "Takes the trains out of every level (Truck Stop, Texas Slave Fortress, the Railyard and so on), a second after the level starts."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"
